name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#18181B&color_dots=#ebedf0,#b7f2d4,#7ae7b4,#33E092,#0E9F5F
            dist/snake-dark.svg?palette=github-dark&color_snake=#33E092&color_dots=#1b1b1f,#0e4429,#106c3e,#1fa86a,#33E092

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
